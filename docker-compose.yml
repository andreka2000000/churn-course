services:
  # 1. База данных
  db:
    image: postgres:16-alpine
    container_name: churn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: churn_secret_CHANGE_ME
      POSTGRES_DB: churn_course
    volumes:
      - churn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn_course"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python-песочница
  pyrunner:
    build: ./PyRunner
    container_name: churn-pyrunner
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./PyRunner/data:/app/data:ro
      - ./PyRunner/workspaces:/app/workspaces
    env_file:
      - ./PyRunner/.env
    environment:
      - SANDBOX_IMAGE=churn-sandbox:latest
      - DATA_DIR=/app/data
      - WORKSPACES_DIR=/app/workspaces
      - HOST_DATA_DIR=/opt/churn-course/PyRunner/data
      - HOST_WORKSPACES_DIR=/opt/churn-course/PyRunner/workspaces
    depends_on:
      - db

  # 3. Go-бэкенд
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: churn-backend
    restart: unless-stopped
    volumes:
      - ./content:/content
    environment:
      - DATABASE_URL=host=db port=5432 user=churn password=churn_secret_CHANGE_ME dbname=churn_course sslmode=disable
      - SERVER_PORT=8080
      - JWT_SECRET=CHANGE_ME_RANDOM_32_HEX
      - JWT_EXPIRES_HOURS=72
      - RUNNER_URL=http://pyrunner:9000
      - PUBLIC_BASE_URL=https://churn-course-ai.ru
      - GIN_MODE=release
      - CORS_ORIGINS=https://churn-course-ai.ru,https://www.churn-course-ai.ru
    depends_on:
      db:
        condition: service_healthy

  # 4. React-фронтенд (только на localhost, наружу — Nginx хоста)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: churn-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend

volumes:
  churn-pgdata: