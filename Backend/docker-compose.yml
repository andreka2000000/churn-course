services:
  db:
    image: postgres:16-alpine
    container_name: churn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: churn_secret
      POSTGRES_DB: churn_course
    ports:
      - "5433:5432"
    volumes:
      - churn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn_course"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  churn-pgdata: